<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALFA GROUP Pembukuan Keuangan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }
body {
margin: 0;
padding: 16px;
font-family: Arial, sans-serif;
background: #f1f5f9;
color: #172033;
}
.container { max-width: 850px; margin: auto; }
header {
background: #123b68;
color: white;
padding: 22px 16px;
border-radius: 14px;
margin-bottom: 18px;
}
h1 { font-size: 22px; margin: 0 0 6px; }
h2 { font-size: 18px; margin-top: 0; }
.muted { font-size: 13px; opacity: .85; }
.card {
background: white;
padding: 18px;
margin-bottom: 16px;
border-radius: 12px;
box-shadow: 0 2px 8px #0000000a;
}
label {
display: block;
font-size: 14px;
font-weight: bold;
margin: 12px 0 6px;
}
input, select, button {
width: 100%;
padding: 12px;
border-radius: 8px;
font-size: 15px;
}
input, select {
border: 1px solid #cbd5e1;
background: white;
}
button {
border: 0;
background: #1769aa;
color: white;
font-weight: bold;
margin-top: 14px;
cursor: pointer;
}
button:disabled { opacity: .6; }
.secondary { background: #475569; }
.danger {
background: #b91c1c;
padding: 7px 10px;
width: auto;
margin: 0;
font-size: 12px;
}
.hidden { display: none !important; }
.message {
margin-top: 12px;
font-size: 14px;
overflow-wrap: anywhere;
}
.totals {
display: grid;
grid-template-columns: repeat(3, minmax(0, 1fr));
gap: 9px;
margin-bottom: 16px;
}
.total {
background: white;
padding: 13px 9px;
border-radius: 10px;
overflow-wrap: anywhere;
}
.total small { display: block; color: #64748b; }
.total strong {
display: block;
font-size: 14px;
margin-top: 7px;
}
.income { color: #15803d; }
.expense { color: #b91c1c; }
.table-wrap { overflow-x: auto; }
table {
border-collapse: collapse;
width: 100%;
min-width: 650px;
font-size: 13px;
}
th, td {
padding: 10px;
border-bottom: 1px solid #e2e8f0;
text-align: left;
}
th { background: #f8fafc; }
@media (max-width: 420px) {
body { padding: 10px; }
.totals { gap: 5px; }
.total { padding: 10px 6px; }
.total strong { font-size: 12px; }
}
</style>
</head>

<body>
<div class="container">

<header>
<h1>ALFA GROUP</h1>
<div>Pembukuan Keuangan</div>
<div class="muted">Catat dan pantau transaksi usaha</div>
</header>

<section id="login" class="card">
<h2>Login Pengguna</h2>

<form id="loginForm">
<label for="email">Email</label>
<input id="email" type="email" autocomplete="username"
placeholder="Masukkan email" required>

<label for="password">Password</label>
<input id="password" type="password"
autocomplete="current-password"
placeholder="Masukkan password" required>

<button id="loginBtn" type="submit">Masuk</button>
</form>

<div id="loginMessage" class="message" role="status"></div>
</section>

<section id="app" class="hidden">

<div class="card">
<div id="who"></div>
<button id="logout" class="secondary" type="button">Keluar</button>
</div>

<div class="totals">
<div class="total">
<small>Pemasukan</small>
<strong id="totalIncome" class="income">Rp0</strong>
</div>
<div class="total">
<small>Pengeluaran</small>
<strong id="totalExpense" class="expense">Rp0</strong>
</div>
<div class="total">
<small>Saldo</small>
<strong id="totalBalance">Rp0</strong>
</div>
</div>

<div class="card">
<h2>Tambah Transaksi</h2>

<form id="txForm">
<label for="tanggal">Tanggal</label>
<input id="tanggal" type="date" required>

<label for="jenis">Jenis transaksi</label>
<select id="jenis" required>
<option value="Pemasukan">Pemasukan</option>
<option value="Pengeluaran">Pengeluaran</option>
</select>

<label for="keterangan">Keterangan</label>
<input id="keterangan" type="text"
placeholder="Contoh: Penjualan tiket" required>

<label for="jumlah">Jumlah (Rp)</label>
<input id="jumlah" type="number" min="1" step="any"
placeholder="Masukkan jumlah" required>

<label for="akun">Akun</label>
<input id="akun" type="text"
placeholder="Contoh: Kas atau Bank">

<label for="kategori">Kategori</label>
<input id="kategori" type="text"
placeholder="Contoh: Tiket kapal">

<label for="metode">Metode pembayaran</label>
<select id="metode">
<option value="Tunai">Tunai</option>
<option value="Transfer">Transfer</option>
<option value="QRIS">QRIS</option>
<option value="Lainnya">Lainnya</option>
</select>

<label for="nomor_bukti">Nomor bukti transaksi</label>
<input id="nomor_bukti" type="text"
placeholder="Nomor nota atau bukti (opsional)">

<button id="saveBtn" type="submit">Simpan Transaksi</button>
</form>

<div id="txMessage" class="message" role="status"></div>
</div>

<div class="card">
<h2>Riwayat Transaksi</h2>
<button id="refreshBtn" class="secondary" type="button">
Muat Ulang Data
</button>
<div id="listMessage" class="message" role="status"></div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Jenis</th>
<th>Jumlah</th>
<th>Akun</th>
<th>Bukti</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="txList"></tbody>
</table>
</div>
</div>

</section>
</div>

<script>
"use strict";

/* MASUKKAN URL DAN PUBLISHABLE KEY SUPABASE MILIK KAMU */
const SUPABASE_URL = "TEMPEL_URL_SUPABASE_DI_SINI";
const SUPABASE_KEY = "TEMPEL_PUBLISHABLE_KEY_DI_SINI";

const $` = id => document.getElementById(id);

const rupiah = value =>
new Intl.NumberFormat("id-ID", {
style: "currency",
currency: "IDR",
maximumFractionDigits: 0
}).format(Number(value) || 0);

const today = () => {
const d = new Date();
d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
return d.toISOString().slice(0, 10);
};

let db = null;
let busy = false;

function message(id, text) {
`$(id).textContent = text || "";
}

function setBusy(buttonId, value) {
$`(buttonId).disabled = value;
}

function showSession(session) {
$("login").classList.toggle("hidden", !!session); $("app").classList.toggle("hidden", !session);

if (session) {
`$("who").textContent = "Login sebagai: " +
(session.user.email || "Pengguna");
}
}

async function loadTransactions() {
message("listMessage", "Memuat transaksi...");
$`("txList").replaceChildren();

const { data, error } = await db
.from("transaksi")
.select("*")
.order("tanggal", { ascending: false });

if (error) {
message("listMessage", "Gagal memuat data: " + error.message);
return;
}

let income = 0;
let expense = 0;

for (const tx of data) {
const amount = Number(tx.jumlah) || 0;

if (String(tx.jenis).toLowerCase() === "pemasukan") {
income += amount;
} else {
expense += amount;
}

const tr = document.createElement("tr");

const values = [
tx.tanggal || "-",
tx.keterangan || "-",
tx.jenis || "-",
rupiah(amount),
tx.akun || "-",
tx.nomor_bukti || "-"
 ];

for (const value of values) {
const td = document.createElement("td");
td.textContent = value;
tr.appendChild(td);
}

const actionCell = document.createElement("td");
const deleteBtn = document.createElement("button");
deleteBtn.type = "button";
deleteBtn.className = "danger";
deleteBtn.textContent = "Hapus";

deleteBtn.addEventListener("click", async () => {
if (!confirm("Hapus transaksi ini?")) return;

deleteBtn.disabled = true;

const { error: deleteError } = await db
.from("transaksi")
.delete()
.eq("id", tx.id);

if (deleteError) {
alert("Gagal menghapus: " + deleteError.message);
deleteBtn.disabled = false;
return;
}

await loadTransactions();
});

actionCell.appendChild(deleteBtn);
tr.appendChild(actionCell);
`$("txList").appendChild(tr);
}

 ("totalExpense").textContent = rupiah(expense);
$`("totalBalance").textContent = rupiah(income - expense);

message("listMessage", data.length
? "Jumlah transaksi: " + data.length
: "Belum ada transaksi.");
}

`$("loginForm").addEventListener("submit", async event => {
event.preventDefault();
if (busy) return;

busy = true;
setBusy("loginBtn", true);
message("loginMessage", "Sedang masuk...");

try {
const { data, error } = await db.auth.signInWithPassword({
email:  ("password").value
});

if (error) throw error;

$`("password").value = "";
showSession(data.session);
message("loginMessage", "");
await loadTransactions();

} catch (error) {
message("loginMessage", "Login gagal: " + error.message);
} finally {
busy = false;
setBusy("loginBtn", false);
}
});

`$("txForm").addEventListener("submit", async event => {
event.preventDefault();
if (busy) return;

busy = true;
setBusy("saveBtn", true);
message("txMessage", "Menyimpan transaksi...");

try {
const { data: sessionData, error: sessionError } =
await db.auth.getSession();

if (sessionError) throw sessionError;
if (!sessionData.session) throw new Error("Silakan login kembali.");

const amount = Number($`("jumlah").value);

if (!Number.isFinite(amount) || amount <= 0) {
throw new Error("Jumlah harus lebih dari nol.");
}

const record = {
tanggal: $("tanggal").value, keterangan: $("keterangan").value.trim(),
jenis: $("jenis").value, jumlah: amount, akun: $("akun").value.trim(),
kategori: $("kategori").value.trim(), metode: $("metode").value,
nomor_bukti: `$("nomor_bukti").value.trim()
};

const { error } = await db.from("transaksi").insert(record);

if (error) throw error;

 ("tanggal").value = today();
message("txMessage", "Transaksi berhasil disimpan.");
await loadTransactions();

} catch (error) {
message("txMessage", "Gagal menyimpan: " + error.message);
} finally {
busy = false;
setBusy("saveBtn", false);
}
});

$`("logout").addEventListener("click", async () => {
const { error } = await db.auth.signOut();

if (error) {
alert("Gagal keluar: " + error.message);
return;
}

showSession(null);
$("password").value = ""; $("txForm").reset();
`$("txList").replaceChildren();
message("loginMessage", "Kamu sudah keluar.");
});

$`("refreshBtn").addEventListener("click", loadTransactions);

async function startApp() {
`$("tanggal").value = today();

if (
SUPABASE_URL.includes("https://oresxisdexqymuqdbbcl.supabase.co") ||
SUPABASE_KEY.includes("sb_publishable_mlPksSDsuW4YMiputDkXmw_mdwXuleq")
) {
message("loginMessage",
"Konfigurasi belum diisi. Masukkan URL dan Publishable Key Supabase.");
$("loginBtn").disabled = true;
return;
}

try {
db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const { data, error } = await db.auth.getSession();
if (error) throw error;

showSession(data.session);

if (data.session) await loadTransactions();

db.auth.onAuthStateChange((_event, session) => {
showSession(session);
});

} catch (error) {
message("loginMessage", "Gagal memulai aplikasi: " + error.message);
}
}

startApp();
</script>
</body>
 </html>
