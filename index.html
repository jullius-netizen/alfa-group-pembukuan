<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALFA GROUP Pembukuan Keuangan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#123c32;color:white;padding:22px 16px}
header h2{margin:0 0 6px}
main{max-width:760px;margin:auto;padding:16px}
.card{background:white;padding:18px;border-radius:14px;margin-bottom:15px;box-shadow:0 2px 8px #0000000b}
h3{margin-top:0}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd5df;border-radius:8px;font-size:15px}
button{background:#176b50;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:#e6f3ec;padding:12px 7px;border-radius:10px;text-align:center;overflow-wrap:anywhere}
.stat small{display:block;margin-bottom:7px}
.money{font-size:14px;font-weight:bold}
.item{padding:12px 0;border-bottom:1px solid #e5e7eb}
.item:last-child{border:0}
.muted{color:#64748b;font-size:13px}
.hidden{display:none}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row button{width:auto;padding:10px}
#message{white-space:pre-wrap;font-size:14px}
@media(max-width:380px){.grid{grid-template-columns:1fr}.stat{text-align:left}}
</style>
</head>
<body>
<header>
<h2>ALFA GROUP</h2>
<div>Pembukuan Keuangan</div>
</header>
<main>
<div id="login" class="card">
<h3>Login Pengguna</h3>
<p class="muted">Masuk dengan akun yang sudah dibuat oleh administrator.</p>
<form id="loginForm">
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password" required>
<button id="loginBtn" type="submit">Masuk</button>
</form>
</div>

<div id="app" class="hidden">
<div class="card">
<div class="row">
<div><strong>Ringkasan Keuangan</strong><div id="who" class="muted"></div></div>
<button id="logout">Keluar</button>
</div>
<div class="grid" style="margin-top:15px">
<div class="stat"><small>Saldo Cash</small><div id="cash" class="money">Rp0</div></div>
<div class="stat"><small>Saldo Debit</small><div id="debit" class="money">Rp0</div></div>
<div class="stat"><small>Saldo Utama</small><div id="utama" class="money">Rp0</div></div>
</div>
</div>

<div class="card">
<h3>Tambah Transaksi</h3>
<form id="txForm">
<label>Tanggal</label>
<input id="tanggal" type="date" required>
<label>Jenis transaksi</label>
<select id="jenis" required>
<option value="pemasukan">Pemasukan</option>
<option value="pengeluaran">Pengeluaran</option>
</select>
<label>Jumlah (Rp)</label>
<input id="jumlah" type="number" min="1" step="1" placeholder="Contoh: 150000" required>
<label>Akun</label>
<select id="akun" required>
<option value="Cash">Cash</option>
<option value="Debit">Debit</option>
<option value="Utama">Utama</option>
</select>
<label>Keterangan</label>
<input id="keterangan" type="text" maxlength="200" placeholder="Keterangan transaksi" required>
<label>Kategori</label>
<input id="kategori" type="text" maxlength="100" placeholder="Contoh: Tiket kapal">
<label>Metode pembayaran</label>
<select id="metode">
<option value="Tunai">Tunai</option>
<option value="Transfer">Transfer</option>
<option value="QRIS">QRIS</option>
<option value="Lainnya">Lainnya</option>
</select>
<label>Nomor bukti (opsional)</label>
<input id="nomor_bukti" type="text" maxlength="100" placeholder="Nomor nota atau bukti">
<button id="saveBtn" type="submit">Simpan Transaksi</button>
</form>
</div>

<div class="card">
<div class="row">
<h3>Riwayat Transaksi</h3>
<button id="refresh">Muat ulang</button>
</div>
<div id="history" class="muted">Memuat data...</div>
</div>
</div>
<div id="message" role="status"></div>
<p class="muted">ALFA GROUP · Pembukuan Keuangan</p>
</main>
